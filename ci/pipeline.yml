include:
  - remote: "https://gitlab.com/cscs-ci/recipes/-/raw/master/templates/v2/.ci-ext.yml"

stages:
  - build
  - test

variables:
  PERSIST_IMAGE_NAME: $CSCS_REGISTRY_PATH/quda/public/build:$CI_COMMIT_SHORT_SHA

build_job:
  stage: build
  extends: .container-builder-cscs-gh200
  variables:
    DOCKERFILE: ci/docker/Dockerfile.build

test_job:
  stage: test
  extends: .container-runner-daint-gh200
  image: $PERSIST_IMAGE_NAME
  script:
    - if [[ $SLURM_LOCALID == "0" ]]; then rm -rf /quda/build/Testing && ln -s /dev/shm /quda/build/Testing; fi
    - sleep 1
    # Only rank 0 of this step runs ctest at all. Each test binary gets its
    # own self-contained MPI world via QUDA_CTEST_LAUNCH's `mpirun -launcher
    # fork` (see ci/docker/Dockerfile.build) instead of joining the ambient
    # srun/PMI2 environment of this step, since Slurm's PMI-2 plugin can't
    # support the ~130 sequential MPI_Init/MPI_Finalize cycles ctest performs
    # within one step (only the first one succeeds; every later test dies
    # with SIGPIPE as slurmstepd tears down the stale PMI2 connection).
    - if [[ $SLURM_LOCALID == "0" ]]; then ctest --test-dir /quda/build/ --output-on-failure; fi
  variables:
    NVIDIA_VISIBLE_DEVICES: all
    SLURM_JOB_NUM_NODES: 1
    SLURM_NTASKS: 4
    SLURM_PARTITION: normal
    SLURM_TIMELIMIT: "02:00:00"
    USE_MPI: "YES"
    QUDA_ENABLE_TUNING: 0
    QUDA_RESOURCE_PATH: .
    # Our MPICH is built against libfabric+xpmem (ch4:ofi), so it can be
    # launched with plain PMI-2 rather than depending on the Cray PALS/
    # cray_shasta plugin or any host-mounted Cray PE libraries. This only
    # matters for this outer step launch itself now (rank 0 vs. idle ranks);
    # the actual test binaries are launched by Hydra's own "fork" launcher,
    # not via this PMI2 wire-up (see the script above).
    SLURM_MPI_TYPE: pmi2
    MPIR_CVAR_CH4_OFI_ENABLE_HMEM: 1
