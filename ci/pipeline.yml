include:
  - remote: "https://gitlab.com/cscs-ci/recipes/-/raw/master/templates/v2/.ci-ext.yml"

stages:
  - build
  - test

variables:
  PERSIST_IMAGE_NAME: $CSCS_REGISTRY_PATH/quda/public/build:$CI_COMMIT_SHORT_SHA

build_job:
  stage: build
  extends: .container-builder-cscs-gh200
  variables:
    DOCKERFILE: ci/docker/Dockerfile.build

test_job:
  stage: test
  extends: .container-runner-daint-gh200
  image: $PERSIST_IMAGE_NAME
  script:
    - if [[ $SLURM_LOCALID == "0" ]]; then rm -rf /quda/build/Testing && ln -s /dev/shm /quda/build/Testing; fi
    - sleep 1
    - ctest --test-dir /quda/build/ --output-on-failure
  variables:
    NVIDIA_VISIBLE_DEVICES: all
    SLURM_JOB_NUM_NODES: 1
    SLURM_NTASKS: 4
    SLURM_PARTITION: normal
    SLURM_TIMELIMIT: "02:00:00"
    USE_MPI: "YES"
    QUDA_ENABLE_TUNING: 0
    QUDA_RESOURCE_PATH: .
    # Our MPICH is built against libfabric+xpmem (ch4:ofi), so it can be
    # launched with plain PMI-2 rather than depending on the Cray PALS/
    # cray_shasta plugin or any host-mounted Cray PE libraries.
    SLURM_MPI_TYPE: pmi2
    MPIR_CVAR_CH4_OFI_ENABLE_HMEM: 1
