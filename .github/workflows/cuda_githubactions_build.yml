name: cuda_ghactions_build

on:
  pull_request:
    branches: [ "develop" ]

defaults:
  run:
    shell: bash

env:
  BUILD_TYPE: STRICT
  CCACHE_COMPILERCHECK: content

jobs:
  build:
    # ubuntu-latest is Ubuntu 26.04. CUDA 13.3 is published for ubuntu2404,
    # which is also what the other 13.x workflows use.
    runs-on: ubuntu-24.04

    steps:
      - name: Install software
        run: |
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ninja-build cmake libopenmpi-dev g++-14 cuda-compiler-13-3 cuda-libraries-dev-13-3 cuda-nvml-dev-13-3

      - uses: actions/checkout@v4

      - name: Ccache for gh actions
        uses: hendrikmuhs/ccache-action@v1.2.17
        with:
          key: ${{ github.job }}-g++-14-cuda-13.3
          max-size: 2000M

      - name: Configure CMake
        run: >
          cmake
          -DCMAKE_CUDA_COMPILER=/usr/local/cuda-13.3/bin/nvcc
          -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DQUDA_GPU_ARCH=sm_80 -DQUDA_GPU_ARCH_SUFFIX=virtual -DQUDA_JITIFY=ON
          -DQUDA_DIRAC_DISTANCE_PRECONDITIONING=ON
          -DQUDA_MULTIGRID=ON
          -DQUDA_MULTIGRID_NVEC_LIST=24
          -DQUDA_MDW_FUSED_LS_LIST=4
          -DQUDA_MPI=ON -DMPI_CXX_SKIP_MPICXX=ON
          -DQUDA_PRECISION=10 -DQUDA_FAST_COMPILE_DSLASH=ON -DQUDA_FAST_COMPILE_REDUCE=ON
          -GNinja
          -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build ${{ github.workspace }}/build

      - name: Install
        run: cmake --install ${{ github.workspace }}/build
