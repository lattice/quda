name: oneapi_ghactions_build

on:
  pull_request:
    branches: [ "develop" ]

defaults:
  run:
    shell: bash

env:
  BUILD_TYPE: RELEASE

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Install software
      run: |
        sudo apt update
        sudo apt install -y gpg-agent wget time util-linux procps
        # download the key to system keyring
        wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
        # add signed entry to apt sources and configure the APT client to use Intel repository:
        echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
        sudo apt update
        sudo apt install -y intel-oneapi-hpc-toolkit

    - name: Setup oneAPI
      run: |
        source /opt/intel/oneapi/setvars.sh
        printenv >> $GITHUB_ENV
        which icpx
        icpx -v
        cat /proc/cpuinfo
        mkdir -p "$RUNNER_TEMP/oneapi-build-diagnostics/compiler"

    - uses: actions/checkout@v4

    - name: Ccache for gh actions
      uses: hendrikmuhs/ccache-action@v1.2.16
      with:
        key: ${{ github.job }}
        max-size: 2000M

    - name: Configure CMake
      run: >
        cmake
        -B ${{github.workspace}}/build
        -GNinja
        -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -DCMAKE_C_COMPILER=icx
        -DCMAKE_CXX_COMPILER=icpx
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -DQUDA_TARGET_TYPE=OMPTARGET
        -DQUDA_OMPTARGET_JIT=ON
        -DQUDA_MAX_BLOCK_SIZE=512
        -DQUDA_WARP_SIZE=16
        -DQUDA_MAX_SHARED_MEMORY_SIZE=49152
        -DQUDA_OMPTARGET_SIMD16=ON
        -DQUDA_DIRAC_DEFAULT_OFF=ON
        -DQUDA_DIRAC_STAGGERED=ON
        -DQUDA_MULTIGRID=OFF
        -DQUDA_RECONSTRUCT=4
        -DQUDA_FAST_COMPILE_REDUCE=ON
        -DQUDA_FAST_COMPILE_DSLASH=ON
        -DCMAKE_CXX_FLAGS="-Wno-unsupported-floating-point-opt -fcrash-diagnostics-dir=${{runner.temp}}/oneapi-build-diagnostics/compiler"
        -DQUDA_OPENMP=ON
        -DQUDA_MPI=ON

    - name: Build
      run: |
        set +m
        diagnostics="$RUNNER_TEMP/oneapi-build-diagnostics"
        mkdir -p "$diagnostics"
        monitor_pid=""
        build_pid=""
        cleanup() {
          build_status=$?
          trap - EXIT
          trap '' INT TERM
          echo "Build command exited with status $build_status; stopping build and monitor processes"
          printf '%s\n' "$build_status" > "$diagnostics/exit-status.txt" || true
          # Ninja jobs can have separate process groups within this session.
          if [[ -n "$build_pid" ]] && pgrep -s "$build_pid" >/dev/null; then
            pkill -TERM -s "$build_pid" 2>/dev/null || true
            sleep 1
            pkill -KILL -s "$build_pid" 2>/dev/null || true
          fi
          if [[ -n "$build_pid" ]]; then wait "$build_pid" 2>/dev/null || true; fi
          if [[ -n "$monitor_pid" ]]; then
            kill "$monitor_pid" 2>/dev/null || true
            wait "$monitor_pid" 2>/dev/null || true
          fi
          cp "$GITHUB_WORKSPACE/build/CMakeCache.txt" "$diagnostics/" 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/build/.ninja_log" "$diagnostics/ninja.log" 2>/dev/null || true
          timeout -k 1s 1s python3 ci/monitor_build_resources.py "$diagnostics/resources.jsonl" --once || true
          exit "$build_status"
        }
        trap cleanup EXIT
        trap 'echo "Build shell received SIGTERM"; exit 143' TERM
        trap 'echo "Build shell received SIGINT"; exit 130' INT
        python3 -u ci/monitor_build_resources.py "$diagnostics/resources.jsonl" --parent-pid "$$" &
        monitor_pid=$!
        setsid bash -o pipefail -c '
          /usr/bin/time -v -o "$1/time.txt" \
            cmake --build "$2/build" --parallel 2 --verbose 2>&1 | tee "$1/build.log"
        ' bash "$diagnostics" "$GITHUB_WORKSPACE" &
        build_pid=$!
        wait "$build_pid"

    - name: Install
      run: cmake --install ${{github.workspace}}/build

    - name: Upload build diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: oneapi-build-diagnostics
        path: ${{runner.temp}}/oneapi-build-diagnostics
        if-no-files-found: ignore
